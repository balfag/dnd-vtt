<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>connectivity spike: echo</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; background: #14161a; color: #e6e6e6; }
  button { font: inherit; padding: 8px 14px; margin-right: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0; }
  figure { margin: 0; }
  canvas, video { width: 320px; max-width: 100%; background: #000; display: block; }
  pre { background: #0c0d10; padding: 8px; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Echo: <span id="mode">?</span></h1>
<p>
  <button id="start">Start echo</button>
  <button id="wsping">WebSocket RTT</button>
  <label><input type="checkbox" id="cam"> camera instead of test pattern</label>
</p>
<div class="row">
  <figure><canvas id="src" width="640" height="360"></canvas><figcaption>sent</figcaption></figure>
  <figure><video id="echo" autoplay muted playsinline></video><figcaption>echoed back</figcaption></figure>
</div>
<pre id="out">idle</pre>
<script>
"use strict";
// Query: ?auto=1 starts at once; &duration=15 seconds to measure; &camera=1 uses
// getUserMedia; &relay=0 disables relay-only policy in turn-tcp mode.
// The result is kept in window.__result (read it from DevTools or a test script).
const q = new URLSearchParams(location.search);
const out = document.getElementById('out');
const log = (...a) => { out.textContent += '\n' + a.join(' '); console.log(...a); };
const nowMs = () => performance.timeOrigin + performance.now();

// --- time barcode: 24 bits of the sender clock, 16x16 px cells in the top-left corner.
const BITS = 24, CELL = 16, MASK = (1 << BITS) - 1;
const src = document.getElementById('src');
const sctx = src.getContext('2d');
let camVideo = null;
function drawFrame() {
  const t = nowMs();
  sctx.fillStyle = '#2b3a67'; sctx.fillRect(0, 0, src.width, src.height);
  if (camVideo && camVideo.videoWidth) sctx.drawImage(camVideo, 0, 0, src.width, src.height);
  else {
    // moving shapes so the encoder has real work to do
    for (let i = 0; i < 12; i++) {
      sctx.fillStyle = `hsl(${(i * 30 + t / 20) % 360} 70% 55%)`;
      const x = (Math.sin(t / 700 + i) * 0.5 + 0.5) * (src.width - 80);
      const y = 40 + (Math.cos(t / 900 + i * 1.7) * 0.5 + 0.5) * (src.height - 120);
      sctx.fillRect(x, y, 60 + i * 2, 40);
    }
  }
  const v = Math.floor(t) & MASK;
  sctx.fillStyle = '#808080'; sctx.fillRect(0, 0, BITS * CELL, CELL);
  for (let b = 0; b < BITS; b++) {
    sctx.fillStyle = (v >> (BITS - 1 - b)) & 1 ? '#fff' : '#000';
    sctx.fillRect(b * CELL, 0, CELL, CELL);
  }
}
function readBarcode(vid, cv) {
  const c = cv.getContext('2d', { willReadFrequently: true });
  c.drawImage(vid, 0, 0, vid.videoWidth, vid.videoHeight, 0, 0, cv.width, cv.height);
  let v = 0;
  for (let b = 0; b < BITS; b++) {
    const d = c.getImageData(b * CELL + CELL / 2 - 1, CELL / 2 - 1, 2, 2).data;
    const luma = (d[0] + d[1] + d[2]) / 3;
    v = (v << 1) | (luma > 128 ? 1 : 0);
  }
  return v >>> 0;
}

async function cfg() { return (await fetch('/config')).json(); }

function wsUrl() { return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws'; }

function wsRtt(n = 10) {
  return new Promise((resolve) => {
    const ws = new WebSocket(wsUrl());
    const rtts = [];
    ws.onopen = () => ws.send(JSON.stringify({ type: 'ping', t: nowMs() }));
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type !== 'pong') return;
      rtts.push(nowMs() - m.t);
      if (rtts.length < n) ws.send(JSON.stringify({ type: 'ping', t: nowMs() }));
      else { ws.close(); resolve(rtts); }
    };
    ws.onerror = () => resolve(rtts);
  });
}
const stat = (a) => {
  if (!a.length) return null;
  const s = [...a].sort((x, y) => x - y);
  const p = (f) => s[Math.min(s.length - 1, Math.floor(f * s.length))];
  return { n: a.length, min: +s[0].toFixed(1), p50: +p(0.5).toFixed(1), p95: +p(0.95).toFixed(1), max: +s[s.length - 1].toFixed(1),
           avg: +(a.reduce((x, y) => x + y, 0) / a.length).toFixed(1) };
};

async function startEcho() {
  const c = await cfg();
  document.getElementById('mode').textContent = c.mode;
  const res = { mode: c.mode, page: location.href, connected: false };
  window.__result = res;
  const t0 = performance.now();

  if (q.get('camera') === '1' || document.getElementById('cam').checked) {
    const ms = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 360 }, audio: false });
    camVideo = document.createElement('video');
    camVideo.srcObject = ms; camVideo.muted = true; camVideo.playsInline = true; await camVideo.play();
  }
  drawFrame();
  setInterval(drawFrame, 33);
  const stream = src.captureStream(30);

  const conf = {};
  if (c.mode === 'turn-tcp') {
    conf.iceServers = [{ urls: `turn:${location.hostname}:${c.turnPort}?transport=tcp`, username: c.turnUser, credential: c.turnPass }];
    if (q.get('relay') !== '0') conf.iceTransportPolicy = 'relay';
  }
  const pc = new RTCPeerConnection(conf);
  window.__pc = pc;
  pc.addTrack(stream.getVideoTracks()[0], stream);
  // Prefer VP8: the server only registers VP8.
  const tr = pc.getTransceivers()[0];
  const caps = RTCRtpSender.getCapabilities('video').codecs.filter((x) => x.mimeType === 'video/VP8');
  if (tr.setCodecPreferences && caps.length) tr.setCodecPreferences(caps);

  const echo = document.getElementById('echo');
  const remote = new Promise((r) => { pc.ontrack = (e) => { echo.srcObject = e.streams[0] || new MediaStream([e.track]); r(); }; });
  pc.oniceconnectionstatechange = () => {
    log('ice', pc.iceConnectionState, (performance.now() - t0).toFixed(0) + 'ms');
    if (pc.iceConnectionState === 'connected' && res.iceMs === undefined) res.iceMs = +(performance.now() - t0).toFixed(0);
    if (pc.iceConnectionState === 'failed') { res.failed = true; }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await new Promise((r) => {
    if (pc.iceGatheringState === 'complete') return r();
    pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && r();
    setTimeout(r, 8000);
  });
  res.gatherMs = +(performance.now() - t0).toFixed(0);
  res.localCandidates = pc.localDescription.sdp.split('\r\n').filter((l) => l.startsWith('a=candidate:')).map((l) => l.split(' ').slice(2, 8).join(' '));
  log('local candidates:', JSON.stringify(res.localCandidates));

  const ws = new WebSocket(wsUrl());
  const answer = new Promise((resolve, reject) => {
    ws.onopen = () => ws.send(JSON.stringify({ type: 'offer', sdp: pc.localDescription.sdp }));
    ws.onmessage = (e) => { const m = JSON.parse(e.data); if (m.type === 'answer') resolve(m.sdp); else if (m.type === 'error') reject(new Error(m.sdp)); };
    ws.onerror = () => reject(new Error('websocket error'));
  });
  await pc.setRemoteDescription({ type: 'answer', sdp: await answer });

  // First decoded frame on the echoed video.
  const ttff = await Promise.race([
    new Promise((r) => echo.requestVideoFrameCallback(() => r(+(performance.now() - t0).toFixed(0)))),
    new Promise((r) => setTimeout(() => r(null), 20000)),
  ]);
  res.ttffMs = ttff;
  res.connected = ttff !== null;
  log('first frame:', ttff, 'ms');
  if (!res.connected) return res;

  // Echo latency from the barcode, sampled on every rendered frame.
  const cv = document.createElement('canvas'); cv.width = 640; cv.height = 360;
  const lat = [];
  const start = performance.now();
  const dur = (+q.get('duration') || 15) * 1000;
  await new Promise((done) => {
    const tick = () => {
      if (performance.now() - start > dur) return done();
      if (echo.videoWidth) {
        const sent = readBarcode(echo, cv);
        const d = (Math.floor(nowMs()) & MASK) - sent;
        const ms = d < 0 ? d + MASK + 1 : d;
        if (ms < 5000) lat.push(ms);
      }
      echo.requestVideoFrameCallback(tick);
    };
    echo.requestVideoFrameCallback(tick);
  });
  res.latency = stat(lat);
  res.ws = stat(await wsRtt(10));

  const st = await pc.getStats();
  let pairId = null;
  st.forEach((r) => { if (r.type === 'transport' && r.selectedCandidatePairId) pairId = r.selectedCandidatePairId; });
  const get = (id) => st.get(id);
  const pair = pairId ? get(pairId) : null;
  if (pair) {
    const l = get(pair.localCandidateId), r = get(pair.remoteCandidateId);
    res.pair = { local: l && `${l.candidateType}/${l.protocol}${l.relayProtocol ? '(' + l.relayProtocol + ')' : ''}`, remote: r && `${r.candidateType}/${r.protocol}`, rttMs: pair.currentRoundTripTime * 1000 };
  }
  st.forEach((r) => {
    if (r.type === 'outbound-rtp' && r.kind === 'video') { res.sentBytes = r.bytesSent; res.sentFrames = r.framesSent; res.sentW = r.frameWidth; }
    if (r.type === 'inbound-rtp' && r.kind === 'video') { res.recvBytes = r.bytesReceived; res.recvFrames = r.framesDecoded; res.recvLost = r.packetsLost; }
  });
  log(JSON.stringify(res, null, 1));
  res.done = true;
  return res;
}

document.getElementById('start').onclick = () => startEcho().catch((e) => { log('error:', e.message); window.__result = { ...(window.__result || {}), error: e.message, done: true }; });
document.getElementById('wsping').onclick = async () => log('ws rtt', JSON.stringify(stat(await wsRtt(20))));
cfg().then((c) => { document.getElementById('mode').textContent = c.mode; });
if (q.get('auto') === '1') document.getElementById('start').click();
</script>
</body>
</html>
