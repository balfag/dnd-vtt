name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web lint
      - run: pnpm -C web test
      - run: pnpm -C web build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  go:
    name: Go (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - run: go test -count=1 ./...
      - name: Build binary
        shell: bash
        run: |
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o "out/dndvtt${ext}" ./cmd/dndvtt
      - uses: actions/upload-artifact@v7
        with:
          name: dndvtt-${{ runner.os }}-amd64
          path: out/
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E
    needs: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dndvtt-Linux-amd64
          path: out
      - run: chmod +x out/dndvtt
      - run: pnpm -C web exec playwright install --with-deps chromium
      - run: pnpm -C web e2e
        env:
          DNDVTT_E2E_BIN: ${{ github.workspace }}/out/dndvtt
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: web/test-results
          retention-days: 7

  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true
