version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
  exclusions:
    rules:
      # Tests use plain helpers on purpose; context plumbing is for production code.
      - path: _test\.go
        linters:
          - noctx
formatters:
  enable:
    - gofmt
    - goimports
